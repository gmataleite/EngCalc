name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security:
      name: Security & Secret Scanning
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Check for sensitive files and hardcoded secrets
          run: |
            # Searches for sensitive files ignoring .env.example or .template
            SENSITIVE_FILES=$(git ls-files | grep -iE '(\.env$|\.env\.|secrets\.json|appsettings\..*\.local\.json|\.pem$|\.pfx$|\.key$|\.sqlite$|\.db$)' | grep -v -iE '(\.example$|\.template$)' || true)
            
            if [ -n "$SENSITIVE_FILES" ]; then
              echo "::error::Sensitive files detected in the repository!"
              echo "$SENSITIVE_FILES"
              echo "Remove these files from version control and add them to .gitignore."
              exit 1
            fi

            # Prevent hardcoded passwords in tracked appsettings*.json files
            HARDCODED_CREDS=$(git grep -iE '(Password|Pwd)\s*=\s*[^;"\s]+' -- '**/appsettings*.json' 'appsettings*.json' || true)
            if [ -n "$HARDCODED_CREDS" ]; then
              echo "::error::Hardcoded credentials detected in appsettings files! Use User Secrets or Environment Variables instead."
              echo "$HARDCODED_CREDS"
              exit 1
            fi
            echo "No sensitive files or hardcoded credentials detected."

  backend:
    name: .NET Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore dependencies
        run: dotnet restore VesselCalc.sln
        
      - name: Build
        run: dotnet build VesselCalc.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test VesselCalc.Tests/VesselCalc.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend:
    name: React Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Check code formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # - name: Test
      #   run: npm run test
        
      - name: Build (TypeScript & Vite)
        run: npm run build